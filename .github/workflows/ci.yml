name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pulseroadmap
          POSTGRES_PASSWORD: pulseroadmap
          POSTGRES_DB: pulseroadmap
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pulseroadmap -d pulseroadmap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    env:
      PULSEROADMAP_DATABASE_URL: postgresql+psycopg://pulseroadmap:pulseroadmap@localhost:5433/pulseroadmap
      PULSEROADMAP_JWT_SECRET_KEY: ci-test-secret
      PULSEROADMAP_AI_PROVIDER: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: python -m unittest discover -s tests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build